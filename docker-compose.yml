version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: djournal-postgres
    environment:
      POSTGRES_USER: djournal
      POSTGRES_PASSWORD: djournal
      POSTGRES_DB: djournal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djournal"]
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend
    ports:
      - "4000:4000"
    env_file: ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata:
